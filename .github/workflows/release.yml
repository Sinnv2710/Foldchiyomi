name: Release Foldchiyomi

# Push a tag named after the app's versionName (e.g. v1.0.0) to publish a release.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions), so every release is
# signed with the same key and installs over the last one:
#   SIGNING_KEY         the release keystore, base64-encoded (base64 -w0 foldchiyomi.jks)
#   KEY_STORE_PASSWORD  the keystore's password
#   ALIAS               the key's alias
#   KEY_PASSWORD        the key's password
on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Makes app/build.gradle.kts sign with the keystore below instead of a throwaway debug key.
      MIHON_GITHUB_RELEASE: true
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts - the in-app updater would keep offering this release."
            exit 1
          fi

      - name: Check signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set - see the top of .github/workflows/release.yml."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          # A release is built from a clean cache.
          cache-disabled: true

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/foldchiyomi.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleFoss -Pdist=foss --stacktrace
        env:
          storeFile: ${{ runner.temp }}/foldchiyomi.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          set -e
          out=app/build/outputs/apk/foss
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            mv "$out/app-$abi-foss.apk" "Foldchiyomi-$TAG-$abi.apk"
          done
          sha256sum Foldchiyomi-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The source extensions (extensions/*) are separate Gradle projects, so the app build above does not
      # make them. They are built here and signed with the release key, which lets one release update the
      # last one in place. A failure here must not hold back the app, hence continue-on-error.
      - name: Build and sign the source extensions
        continue-on-error: true
        env:
          KS: ${{ runner.temp }}/foldchiyomi.jks
          KS_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for dir in extensions/*/; do
            name=$(basename "$dir")
            [ -f "$dir/build.gradle.kts" ] || continue
            (cd "$dir" && ../../gradlew assembleDebug --stacktrace)
            apk=$(ls "$dir"build/outputs/apk/debug/*-debug.apk | head -1)
            "$apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" \
              --out "Foldchiyomi-extension-$name-$TAG.apk" "$apk"
          done
          ls -la Foldchiyomi-extension-*.apk
          sha256sum Foldchiyomi-extension-*.apk >> SHA256SUMS.txt

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/foldchiyomi.jks"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Foldchiyomi ${{ github.ref_name }}
          body: |
            Mihon for foldables, with a page curl that follows your finger.

            **Which file?** `Foldchiyomi-${{ github.ref_name }}-arm64-v8a.apk` for almost every modern phone. If you're not sure, `Foldchiyomi-${{ github.ref_name }}-universal.apk` works everywhere.

            No analytics, no crash reporting. Built by GitHub Actions from this tag; checksums are in `SHA256SUMS.txt`.

            **Source extensions.** `Foldchiyomi-extension-<name>-${{ github.ref_name }}.apk` are optional sources (TruyenTuoiTho, Internet Archive). They are signed with the same key as the app, so a newer one installs over the older. Install one, then trust it under Browse > Extensions.

            **Found a bug?** Please [open an issue](https://github.com/GarrettKK/Foldchiyomi/issues/new/choose) rather than a Reddit comment, with your device, the app version and a screenshot. Comments get lost; issues get fixed.

            <!-->
          files: |
            Foldchiyomi-*.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
